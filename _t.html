<!DOCTYPE html><html><head><meta charset="utf-8"><style>#out{white-space:pre-wrap;font:12px monospace}</style></head>
<body>
<pre id="out">start</pre>
<iframe id="fa" src="about:blank" style="width:600px;height:900px;border:0"></iframe>
<script>
const log = m => document.getElementById("out").textContent += "\n" + m;
const wait = ms => new Promise(r => setTimeout(r, ms));
const fa = document.getElementById("fa");
for (const k of ["kraken_demo_v3","kraken_notifs_v1","kraken_notifs_v1_seen"]) localStorage.removeItem(k);
localStorage.setItem("kraken_demo_v3", JSON.stringify({
  first:"bernard", last:"", email:"bernard@exemple.com", created:"2014-03-12",
  cash:120, gas:2.40, usdcFee:{erc20:4.5, solana:0.2},
  favorites:["BTC","ETH","DUO","USR"],
  balances:{BTC:0.05, ETH:0.4, SOL:3, USDC:250},
  fees:{}, addresses:{BTC:"bc1qeccrylysamp", SOL:"VaAT9aR6d89RYbEVRnwx37dgdj6mg5V4BxVZMydUtqDA", USDC:"0x8ad6fae07d2653ddd371b99661cd8e72bee651b5"},
  rev:1
}));
fa.src = "index.html#app";
fa.onload = async () => {
  const d = fa.contentDocument;
  await wait(1500);

  // 1. deposit -> unavailable
  d.getElementById("depositBtn").click();
  await wait(300);
  d.getElementById("dpGo").click();
  await wait(200);
  const t1 = d.getElementById("toast").textContent;
  log("depositErr=" + t1);

  // 2. withdraw EUR -> unavailable
  d.querySelector('[data-sheet="withdraw"]').click();
  await wait(300);
  d.getElementById("wdClose").click();
  await wait(200);

  // 3. withdraw BTC -> functional with MAX + fee
  const wa = fa.contentWindow;
  wa.PICK = "BTC"; // not needed, call directly
  fa.contentWindow.eval('sheetWithdraw("BTC")');
  await wait(300);
  const hasMax = !!d.getElementById("wdMax");
  const hasFee = !!d.getElementById("wdFee");
  log("wdMax=" + hasMax + " wdFee=" + hasFee);
  d.getElementById("wdAddr").value = "bc1qeccrylysamp";
  d.getElementById("wdAmt").value = "0,01";
  d.getElementById("wdGo").click();
  await wait(300);
  const st = JSON.parse(localStorage.getItem("kraken_demo_v3"));
  log("btcAfter=" + st.balances.BTC);

  // 4. send BTC -> staking block
  fa.contentWindow.eval('sheetSend("BTC")');
  await wait(300);
  const staking = d.getElementById("stkGo") ? "yes" : "no";
  const cancel = d.getElementById("stkNo") ? "yes" : "no";
  log("staking=" + staking + " cancel=" + cancel);
  if (d.getElementById("stkGo")) d.getElementById("stkGo").click();
  await wait(300);
  const notifs = JSON.parse(localStorage.getItem("kraken_notifs_v1") || "[]");
  log("notifStk=" + (notifs.some(n => (n.text||"").includes("déblocage")) ? "yes" : "no"));

  // 5. send USDC -> networks + MAX
  fa.contentWindow.eval('sheetSend("USDC")');
  await wait(300);
  log("nets=" + d.querySelectorAll("#sdNets .net-chip").length);
  log("maxBtn=" + !!d.getElementById("sdMax"));
  d.getElementById("sdMax").click();
  await wait(200);
  log("maxAmt=" + d.getElementById("sdAmt").value);
  log("feeTxt=" + d.getElementById("sdFee").textContent);
  // switch to solana
  const solChip = Array.from(d.querySelectorAll("#sdNets .net-chip")).find(b => b.dataset.net === "solana");
  if (solChip) solChip.click();
  await wait(200);
  log("solAddrPh=" + d.getElementById("sdAddr").placeholder);
  d.getElementById("sdAddr").value = "VaAT9aR6d89RYbEVRnwx37dgdj6mg5V4BxVZMydUtqDA";
  d.getElementById("sdAmt").value = "10";
  d.getElementById("sdGo").click();
  await wait(300);
  log("confirm=" + (d.getElementById("sdConfirm") ? "yes" : "no"));

  // 6. avatar -> profile
  d.getElementById("avatarBtn").click();
  await wait(300);
  log("profile=" + (d.getElementById("pfAct") ? "yes" : "no"));

  // 7. portfolio -> activity
  const actRows = d.querySelectorAll("#activityRows .act-row").length;
  log("actRows=" + actRows);

  // 8. prediction balance
  const pc = d.getElementById("predCard");
  log("predCard=" + (pc ? "yes" : "no"));
  pc.click();
  await wait(150);
  log("predBalHidden=" + d.getElementById("predBal").hidden);

  // banner presence
  log("bannerCss=" + !!Array.from(d.styleSheets).some(s => { try { return s.href.includes("v8"); } catch { return false; } }));
  log("DONE");
};
</script>
</body></html>
